<script>
(function(){
  var v=document.getElementById('heroVideo');
  var playButton=document.getElementById('heroPlay');
  if(!v)return;
  v.__elanHeroVisible=true;
  v.muted=true;
  v.defaultMuted=true;
  v.autoplay=true;
  v.loop=true;
  v.playsInline=true;
  v.setAttribute('muted','');
  v.setAttribute('playsinline','');
  v.setAttribute('webkit-playsinline','');
  var pauseRetries=0,retryTimer=0;
  function showButton(show){
    if(!playButton)return;
    if(show)playButton.removeAttribute('hidden');else playButton.setAttribute('hidden','');
  }
  function tryPlay(){
    if(v.__elanHeroVisible===false||document.hidden){v.pause();return;}
    v.muted=true;
    var p;
    try{p=v.play();}catch(e){showButton(true);return;}
    if(p&&p.then)p.then(function(){showButton(false);},function(){showButton(true);});
  }
  function setHeroVisibility(visible){v.__elanHeroVisible=visible;if(visible)tryPlay();else v.pause();}
  if(playButton)playButton.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();tryPlay();});
  if('IntersectionObserver' in window){var heroObserver=new IntersectionObserver(function(entries){entries.forEach(function(entry){setHeroVisibility(entry.isIntersecting&&entry.intersectionRatio>=0.05);});},{threshold:[0,0.05]});heroObserver.observe(v.parentElement);}
  else{var checkHeroVisibility=function(){var r=v.parentElement.getBoundingClientRect();setHeroVisibility(r.bottom>0&&r.top<window.innerHeight);};window.addEventListener('scroll',checkHeroVisibility,{passive:true});window.addEventListener('resize',checkHeroVisibility,{passive:true});checkHeroVisibility();}
  v.addEventListener('playing',function(){showButton(false);});
  // Some browsers pause muted autoplay on their own (power saving, tab restore); resume while the hero is on screen.
  v.addEventListener('pause',function(){
    if(v.ended||v.__elanHeroVisible===false||document.hidden||pauseRetries>=10)return;
    pauseRetries++;
    clearTimeout(retryTimer);
    retryTimer=setTimeout(tryPlay,250);
  });
  // Safety net for engines that ignore the loop attribute.
  v.addEventListener('ended',function(){try{v.currentTime=0}catch(e){}tryPlay();});
  v.addEventListener('stalled',function(){if(v.paused)tryPlay();});
  v.addEventListener('suspend',function(){if(v.paused)tryPlay();});
  v.addEventListener('loadedmetadata',tryPlay);
  v.addEventListener('loadeddata',tryPlay);
  v.addEventListener('canplay',tryPlay);
  v.addEventListener('canplaythrough',tryPlay);
  document.addEventListener('visibilitychange',function(){if(document.hidden)v.pause();else{pauseRetries=0;tryPlay();}});
  window.addEventListener('pageshow',function(){pauseRetries=0;tryPlay();});
  // iOS Low Power Mode and strict autoplay policies need one real gesture; touchend/pointerup/keydown count as activation.
  ['touchend','pointerup','click','keydown'].forEach(function(name){document.addEventListener(name,function(){tryPlay();},{once:true,passive:true,capture:true});});
  tryPlay();
  setTimeout(tryPlay,300);
  setTimeout(tryPlay,1000);
  setTimeout(tryPlay,2500);
})();
</script>
